<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HL Outreach Assistant</title>
<style>
  :root{
    --bg:#0B0F0D; --panel:#121815; --border:#223028; --text:#EAF2EC; --muted:#8FA396;
    --emerald:#10B981; --emerald-dim:#0B7A57; --warn:#F59E0B; --danger:#EF4444;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh; padding:32px 16px;
  }
  .wrap{max-width:720px; margin:0 auto;}
  h1{font-size:1.5rem; margin:0 0 4px;}
  .sub{color:var(--muted); margin:0 0 24px; font-size:0.95rem;}
  textarea{
    width:100%; min-height:180px; background:var(--panel); border:1px solid var(--border);
    border-radius:12px; color:var(--text); padding:14px; font-size:0.95rem; resize:vertical;
    font-family:inherit;
  }
  textarea:focus{outline:none; border-color:var(--emerald);}
  button{
    background:var(--emerald); color:#04140D; border:none; border-radius:10px;
    padding:12px 20px; font-size:0.95rem; font-weight:600; cursor:pointer; margin-top:12px;
  }
  button:hover{background:#0FCB8F;}
  button:disabled{background:var(--emerald-dim); cursor:not-allowed;}
  .secondary{
    background:transparent; border:1px solid var(--border); color:var(--text); margin-left:8px;
  }
  .secondary:hover{border-color:var(--emerald); background:transparent;}
  #output{margin-top:24px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px;
  }
  .badge{
    display:inline-block; font-size:0.75rem; font-weight:700; padding:3px 10px; border-radius:999px;
    background:var(--emerald-dim); color:#B7F5DE; margin-bottom:10px; letter-spacing:0.02em;
  }
  .msg{white-space:pre-wrap; line-height:1.5; font-size:0.98rem;}
  .warn-box{
    border:1px solid var(--danger); background:rgba(239,68,68,0.1); border-radius:12px;
    padding:14px; color:#FCA5A5; font-size:0.9rem; margin-top:12px;
  }
  .error{color:var(--danger); font-size:0.9rem; margin-top:12px;}
  .footer-note{color:var(--muted); font-size:0.8rem; margin-top:28px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>HL Outreach Assistant</h1>
  <p class="sub">Paste a HighLevel job board posting. Get a mirror-hook outreach message back, tuned to how the poster wrote it.</p>

  <textarea id="jobInput" placeholder="Paste the full job posting here..."></textarea>
  <div>
    <button id="genBtn" onclick="generate()">Generate message</button>
    <button class="secondary" onclick="clearAll()">Clear</button>
  </div>

  <div id="output"></div>

  <p class="footer-note">Always read it once for fit before sending.</p>
</div>

<script>
async function generate(){
  const btn = document.getElementById('genBtn');
  const input = document.getElementById('jobInput').value.trim();
  const out = document.getElementById('output');

  if(!input){
    out.innerHTML = '<div class="error">Paste a job posting first.</div>';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Generating...';
  out.innerHTML = '';

  try{
    const res = await fetch('/api/generate', {
      method:'POST',
      headers:{'content-type':'application/json'},
      body: JSON.stringify({ jobPost: input })
    });
    const data = await res.json();

    if(!res.ok){
      out.innerHTML = '<div class="error">' + (data.error || 'Something went wrong.') + '</div>';
      return;
    }

    if(data.skipped){
      out.innerHTML = '<div class="warn-box">' + data.message + '</div>';
      return;
    }

    out.innerHTML =
      '<div class="card">' +
        '<span class="badge">Mode ' + escapeHtml(data.mode) + ': ' + escapeHtml(data.modeLabel) + '</span>' +
        '<div class="msg" id="msgText">' + escapeHtml(data.message) + '</div>' +
        '<button class="secondary" style="margin-top:14px;" onclick="copyMsg()">Copy message</button>' +
      '</div>';
  }catch(e){
    out.innerHTML = '<div class="error">Network error, try again.</div>';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Generate message';
  }
}

function copyMsg(){
  const text = document.getElementById('msgText').innerText;
  navigator.clipboard.writeText(text);
  const btns = document.querySelectorAll('.secondary');
  const copyBtn = Array.from(btns).find(b => b.textContent.includes('Copy'));
  if(copyBtn){
    const orig = copyBtn.textContent;
    copyBtn.textContent = 'Copied!';
    setTimeout(()=> copyBtn.textContent = orig, 1500);
  }
}

function clearAll(){
  document.getElementById('jobInput').value = '';
  document.getElementById('output').innerHTML = '';
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
</body>
</html>
